apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-citus-demo
  namespace: citus-demo
spec:
  provider: vault
  secretObjects:                    # ← esto crea el Secret de K8s
  - secretName: citus-credentials
    type: Opaque
    data:
    - objectName: username
      key: POSTGRES_USER
    - objectName: password
      key: POSTGRES_PASSWORD
    - objectName: database
      key: POSTGRES_DB
  parameters:
    vaultAddress: "http://vault-server.vault.svc:8200"
    roleName: "citus-demo"
    objects: |
      - objectName: username
        secretPath: kv/data/citus
        secretKey: username
      - objectName: password
        secretPath: kv/data/citus
        secretKey: password
      - objectName: database
        secretPath: kv/data/citus
        secretKey: database
---
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-envvar-test
  namespace: citus-demo
spec:
  serviceAccountName: pipeline
  containers:
  - name: test-container
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "=== Variables de entorno desde Vault ==="
        echo "POSTGRES_USER:     $POSTGRES_USER"
        echo "POSTGRES_PASSWORD: $POSTGRES_PASSWORD"
        echo "POSTGRES_DB:       $POSTGRES_DB"
        sleep 3600
    env:
    - name: POSTGRES_USER
      valueFrom:
        secretKeyRef:
          name: citus-credentials    # ← Secret creado por secretObjects
          key: POSTGRES_USER
    - name: POSTGRES_PASSWORD
      valueFrom:
        secretKeyRef:
          name: citus-credentials
          key: POSTGRES_PASSWORD
    - name: POSTGRES_DB
      valueFrom:
        secretKeyRef:
          name: citus-credentials
          key: POSTGRES_DB
    volumeMounts:
    - name: vault-secrets
      mountPath: /mnt/secrets        # ← obligatorio para que secretObjects funcione
      readOnly: true
  volumes:
  - name: vault-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: vault-citus-demo