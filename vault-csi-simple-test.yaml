apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-citus-demo
  namespace: citus-demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault-server.vault.svc:8200"
    roleName: "citus-demo"
    objects: |
      - objectName: username        # ← nombre del archivo en /mnt/secrets/
        secretPath: kv/data/citus
        secretKey: username
      - objectName: password
        secretPath: kv/data/citus
        secretKey: password
      - objectName: database
        secretPath: kv/data/citus
        secretKey: database

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline
  namespace: citus-demo
  labels:
    app.kubernetes.io/part-of: citusv2-prueba
---
apiVersion: v1
kind: Pod
metadata:
  name: vault-csi-simple-test
  namespace: citus-demo
spec:
  serviceAccountName: pipeline
  containers:
  - name: test-container
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - |
        echo "=== Archivos en /mnt/secrets ==="
        ls /mnt/secrets/
        echo ""
        echo "username: $(cat /mnt/secrets/username)"
        echo "password: $(cat /mnt/secrets/password)"
        echo "database: $(cat /mnt/secrets/database)"
        sleep 3600
    volumeMounts:
    - name: vault-secrets
      mountPath: /mnt/secrets
      readOnly: true
  volumes:
  - name: vault-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: vault-citus-demo